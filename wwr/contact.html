<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Rapid Rivers Rafting for rafting information, reservations, questions, and website suggestions.">
    <meta name="author" content="James Rex Ovie">

    <title>Contact Us | Rapid Rivers Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <a class="logo-link" href="index.html">
            <img src="images/logo.jpeg" alt="Rapid Rivers Rafting Logo">
        </a>

        <nav aria-label="Main navigation">
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- CONTACT INFORMATION AND FORM -->
        <section class="contact-intro">

            <div class="company-info">
                <h1>Rapid Rivers Rafting</h1>

                <p>
                    <strong>123 Main River Street</strong><br>
                    Kolob, California
                </p>

                <p>
                    <strong>Phone:</strong>
                    <a href="tel:+1 999 999 9999">+1 999 999 9999</a>
                </p>

                <p>
                    <strong>Email:</strong>
                    <a href="mailto:info@rapidriversrafting.com">
                        info@rapidriversrafting.com
                    </a>
                </p>

                <iframe class="contact-map"
                  src="https://www.google.com/maps?q=Kolob%2C%20California&output=embed"
                  title="Map showing the location of Rapid Rivers Rafting in Kolob, California"
                  loading="lazy">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email address"
                      required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label class="radio-option" for="general-inquiry">
                        <input type="radio" id="general-inquiry" name="purpose"
                          value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label class="radio-option" for="reservation-question">
                        <input type="radio" id="reservation-question" name="purpose"
                          value="reservation-question">
                        Reservation Question
                    </label>

                    <label class="radio-option" for="website-suggestion">
                        <input type="radio" id="website-suggestion" name="purpose"
                          value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here..."
                      required></textarea>
                </div>

                <label class="checkbox-option" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <!-- EMPLOYEE PROFILES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/alex_morgan.jpg"
                      alt="Rapid Rivers rafting employee profile picture">
                    <figcaption>
                        <strong>Alex Morgan</strong><br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/james_rex_ovie.jpg"
                      alt="Rapid Rivers rafting employee profile picture">
                    <figcaption>
                        <strong>James Rex Ovie</strong><br>
                        Reservation Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/casey_williams.jpg"
                      alt="Rapid Rivers rafting employee profile picture">
                    <figcaption>
                        <strong>Casey Williams</strong><br>
                        Safety Coordinator
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rapid Rivers Rafting | James Rex Ovie</p>

        <nav class="socialmedia" aria-label="Social media">
            <a href="https://facebook.com" aria-label="Facebook">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com" aria-label="LinkedIn">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com" aria-label="Instagram">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
